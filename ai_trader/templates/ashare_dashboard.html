<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A股智能推荐系统 — AlphaMind</title>
<style>
:root {
  --bg: #0d1117; --card: #161b22; --border: #30363d;
  --text: #c9d1d9; --dim: #8b949e;
  --green: #3fb950; --red: #f85149; --yellow: #d2991d;
  --blue: #58a6ff; --accent: #1f6feb; --accent-hover: #388bfd;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 2vw; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; gap: 12px; }
.header h1 { font-size: 20px; font-weight: 600; white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 12px; }
.btn-analyze { padding: 10px 24px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn-analyze:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
.btn-analyze:disabled { opacity: 0.6; cursor: not-allowed; }

/* ===== 聊天按钮 ===== */
.btn-chat { width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); cursor: pointer; font-size: 18px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; position: relative; }
.btn-chat:hover { border-color: var(--accent); color: var(--accent); }
.btn-chat.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
.spinner.active { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.status-bar { font-size: 13px; color: var(--dim); display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot-ok { background: var(--green); } .dot-warn { background: var(--yellow); } .dot-err { background: var(--red); }
.container { width: 100%; margin: 0 auto; padding: 20px 2vw; transition: margin-left 0.3s; }
.container.chat-open { margin-left: 550px; }
.empty-state { text-align: center; padding: 80px 20px; color: var(--dim); }
.empty-state h2 { font-size: 22px; margin-bottom: 12px; color: var(--text); }
.empty-state p { font-size: 15px; line-height: 1.8; }
.loading-state { display: none; text-align: center; padding: 60px 20px; }
.loading-state.active { display: block; }
.loading-text { font-size: 16px; color: var(--dim); margin-top: 16px; }
.error-banner { background: rgba(248,81,73,0.1); border: 1px solid var(--red); color: var(--red); padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 14px; }

.market-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 2vw; margin-bottom: 24px; }
.market-state-badge { display: inline-block; padding: 6px 20px; border-radius: 6px; font-size: 18px; font-weight: 700; margin-right: 12px; }
.state-attack { background: rgba(248,81,73,0.15); color: var(--red); border: 1px solid rgba(248,81,73,0.3); }
.state-range { background: rgba(210,153,29,0.15); color: var(--yellow); border: 1px solid rgba(210,153,29,0.3); }
.state-defense { background: rgba(63,185,80,0.15); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }
.state-other { background: rgba(139,148,158,0.15); color: var(--dim); border: 1px solid rgba(139,148,158,0.3); }

.market-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.market-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
.market-stat { background: rgba(22,27,34,0.5); border-radius: 8px; padding: 12px 8px; text-align: center; }
.market-stat .stat-val { font-size: 18px; font-weight: 700; }
.market-stat .stat-label { font-size: 11px; color: var(--dim); margin-top: 2px; }
.market-meta { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; font-size: 13px; }
.market-meta-item { display: flex; align-items: center; gap: 4px; }
.market-meta-item .label { color: var(--dim); }
.market-meta-item .value { font-weight: 600; }

.signal-list { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
.signal-bull { color: var(--red); }
.signal-bear { color: var(--green); }
.signal-warn { color: var(--yellow); }

.alert-box { padding: 10px 16px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
.alert-danger { background: rgba(248,81,73,0.08); border: 1px solid rgba(248,81,73,0.2); color: var(--red); }
.alert-warning { background: rgba(210,153,29,0.08); border: 1px solid rgba(210,153,29,0.2); color: var(--yellow); }
.alert-info { background: rgba(31,111,235,0.08); border: 1px solid rgba(31,111,235,0.2); color: var(--blue); }

.market-summary { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 15px; line-height: 1.7; }
.market-indices { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; font-size: 13px; }
.market-index { color: var(--dim); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }

.sector-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.sector-table th { text-align: left; padding: 8px 10px; color: var(--dim); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 12px; }
.sector-table td { padding: 7px 10px; border-bottom: 1px solid rgba(48,54,61,0.5); }
.sector-table tr:hover td { background: rgba(31,111,235,0.06); }
.sector-rank { font-weight: 700; color: var(--dim); width: 28px; }
.sector-rank.top3 { color: var(--yellow); }
.sector-name { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sector-name.focus { color: var(--blue); font-weight: 600; }
.positive { color: var(--red); }
.negative { color: var(--green); }
.sector-score { color: var(--dim); font-size: 12px; }
.focus-tag { display: inline-block; background: rgba(88,166,255,0.15); color: var(--blue); padding: 1px 5px; border-radius: 3px; font-size: 10px; margin-left: 4px; }
.spike-tag { display: inline-block; background: rgba(248,81,73,0.12); color: var(--red); padding: 1px 5px; border-radius: 3px; font-size: 10px; margin-left: 4px; }

.rec-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 2vw; margin-bottom: 20px; transition: border-color 0.2s; }
.rec-card:hover { border-color: var(--accent); }
.rec-card.buy-now { border-left: 3px solid var(--red); }
.rec-card.wait { border-left: 3px solid var(--yellow); }
.rec-card.avoid { border-left: 3px solid var(--green); opacity: 0.7; }
.rec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; }
.rec-title { font-size: 18px; font-weight: 700; }
.rec-code { font-size: 13px; color: var(--dim); font-family: monospace; }
.rec-type-tag { font-size: 11px; padding: 2px 8px; border-radius: 3px; margin-left: 8px; font-weight: 600; }
.tag-stock { background: rgba(88,166,255,0.15); color: var(--blue); }
.tag-etf { background: rgba(139,148,158,0.15); color: var(--dim); }
.rec-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; }
.rec-meta-item { display: flex; gap: 4px; }
.rec-meta-label { color: var(--dim); }
.rec-meta-value { font-weight: 600; }

.grade-badge { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.grade-buy { background: rgba(248,81,73,0.12); color: var(--red); }
.grade-wait { background: rgba(210,153,29,0.12); color: var(--yellow); }
.grade-avoid { background: rgba(63,185,80,0.12); color: var(--green); }

.tranches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.tranche-card { background: rgba(22,27,34,0.6); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
.tranche-highlight { border-color: var(--red); background: rgba(248,81,73,0.06); }
.tranche-num { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
.tranche-price { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
.tranche-detail { font-size: 11px; color: var(--dim); }

.entry-info { display: flex; gap: 20px; flex-wrap: wrap; margin: 10px 0; font-size: 13px; }
.entry-info-item { display: flex; gap: 4px; align-items: center; }
.entry-info-label { color: var(--dim); }
.entry-info-value { font-weight: 600; }
.stop-loss { color: var(--red); font-weight: 700; }

.rec-footer { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.7; }
.rec-reasoning { color: var(--dim); }
.conf-badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.conf-high { background: rgba(248,81,73,0.15); color: var(--red); }
.conf-mid { background: rgba(210,153,29,0.15); color: var(--yellow); }
.conf-low { background: rgba(63,185,80,0.15); color: var(--green); }

.quality-bar { display: flex; gap: 14px; padding: 10px 0; flex-wrap: wrap; font-size: 12px; }
.quality-item { display: flex; align-items: center; gap: 4px; color: var(--dim); }
.icon-ok { color: var(--green); } .icon-warn { color: var(--yellow); } .icon-err { color: var(--red); }

.card-title { font-size: 15px; color: var(--dim); margin-bottom: 16px; font-weight: 600; letter-spacing: 0.5px; }
.no-recs { text-align: center; padding: 40px; color: var(--dim); font-size: 15px; line-height: 1.8; }
.scroll-box { max-height: 70vh; overflow-y: auto; }
.scroll-box::-webkit-scrollbar { width: 4px; }
.scroll-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.updated-at { font-size: 12px; color: var(--dim); margin-top: 4px; }

/* ========== AI 聊天面板 ========== */
.chat-panel { position: fixed; top: 0; left: 0; height: 100vh; width: 550px; max-width: 100vw; background: var(--card); border-right: 1px solid var(--border); z-index: 200; display: flex; flex-direction: column; transform: translateX(-100%); transition: transform 0.3s ease; box-shadow: 4px 0 24px rgba(0,0,0,0.3); }
.chat-panel.open { transform: translateX(0); }
.chat-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
.chat-overlay.open { display: block; }
.chat-panel-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.chat-panel-header h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.chat-panel-header h3 .ai-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.btn-chat-close { width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent; color: var(--dim); cursor: pointer; font-size: 18px; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
.btn-chat-close:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.chat-empty { text-align: center; color: var(--dim); padding: 40px 20px; font-size: 14px; line-height: 1.8; }
.chat-msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.65; word-wrap: break-word; }
.chat-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.chat-msg.ai { align-self: flex-start; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
.chat-msg .msg-time { font-size: 10px; opacity: 0.5; margin-top: 4px; display: block; }
.chat-msg.ai .msg-time { text-align: left; }
.chat-msg.user .msg-time { text-align: right; }
.chat-input-wrap { padding: 12px 18px; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 8px; }
.chat-input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; resize: none; outline: none; font-family: inherit; max-height: 80px; }
.chat-input:focus { border-color: var(--accent); }
.chat-input::placeholder { color: var(--dim); }
.btn-send { width: 40px; height: 40px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; font-size: 16px; transition: all 0.15s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.btn-send:hover:not(:disabled) { background: var(--accent-hover); }
.btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
.typing-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); margin: 0 2px; animation: bounce 1.4s infinite both; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

/* ===== Markdown 渲染样式 ===== */
.chat-msg.ai strong { color: #f0f6fc; font-weight: 700; }
.chat-msg.ai code { background: rgba(139,148,158,0.15); padding: 1px 5px; border-radius: 3px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; color: #f0c040; }
.chat-msg.ai pre { background: rgba(13,17,23,0.6); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; overflow-x: auto; margin: 8px 0; font-size: 13px; line-height: 1.5; }
.chat-msg.ai pre code { background: none; padding: 0; color: var(--text); }
.chat-msg.ai blockquote { border-left: 3px solid var(--accent); margin: 6px 0; padding: 4px 12px; color: var(--dim); background: rgba(31,111,235,0.06); border-radius: 0 4px 4px 0; }
.chat-msg.ai ul, .chat-msg.ai ol { margin: 4px 0; padding-left: 20px; }
.chat-msg.ai li { margin: 2px 0; }
.chat-msg.ai table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
.chat-msg.ai th { background: rgba(255,255,255,0.04); border-bottom: 1px solid var(--border); padding: 6px 10px; text-align: left; font-weight: 600; }
.chat-msg.ai td { padding: 4px 10px; border-bottom: 1px solid rgba(48,54,61,0.5); }
.chat-msg.ai .pos { color: var(--red); } .chat-msg.ai .neg { color: var(--green); }
/* 已记录交易标记 */
.chat-msg .trade-recorded { display: inline-block; font-size: 10px; background: rgba(63,185,80,0.12); color: var(--green); padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: middle; }

/* ========== 平板 ========== */
@media (max-width: 1024px) {
  .grid-2 { gap: 16px; }
  .market-stats { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .tranches { gap: 6px; }
  .tranche-card { padding: 8px; }
  .tranche-price { font-size: 15px; }
  .container.chat-open { margin-left: 450px; }
  .chat-panel { width: 450px; }
}

/* ========== 手机端 ========== */
@media (max-width: 768px) {
  .header { padding: 10px 12px; flex-wrap: wrap; }
  .header h1 { font-size: 16px; }
  .header-right { width: 100%; justify-content: space-between; }
  .btn-analyze { padding: 8px 16px; font-size: 13px; border-radius: 6px; }
  .status-bar { font-size: 12px; }

  .container { padding: 12px 10px; }
  .container.chat-open { margin-left: 0; }
  .market-card { padding: 14px 12px; border-radius: 10px; margin-bottom: 14px; }
  .market-state-badge { font-size: 15px; padding: 4px 14px; }
  .market-header { gap: 8px; font-size: 13px; }
  .market-stats { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .market-stat { padding: 10px 4px; }
  .market-stat .stat-val { font-size: 15px; }
  .market-stat .stat-label { font-size: 10px; }
  .market-meta { gap: 10px; font-size: 11px; }
  .market-summary { font-size: 13px; }
  .market-indices { font-size: 11px; gap: 8px; }

  .grid-2 { grid-template-columns: 1fr; gap: 14px; }

  .rec-card { padding: 14px 12px; border-radius: 10px; margin-bottom: 12px; }
  .rec-header { flex-direction: column; align-items: flex-start; gap: 6px; }
  .rec-title { font-size: 16px; }
  .rec-meta { font-size: 12px; gap: 8px; }
  .rec-footer { font-size: 13px; }

  .tranches { grid-template-columns: 1fr; gap: 6px; }
  .tranche-card { padding: 10px; }

  .entry-info { flex-direction: column; gap: 6px; font-size: 12px; }

  .sector-table { font-size: 12px; }
  .sector-table th, .sector-table td { padding: 6px 6px; }
  .sector-name { max-width: 70px; }

  .grade-badge { font-size: 12px; padding: 3px 8px; }
  .conf-badge { font-size: 11px; padding: 2px 8px; }
  .rec-reasoning { font-size: 13px; }

  .quality-bar { gap: 8px; font-size: 11px; }
  .card-title { font-size: 13px; margin-bottom: 10px; }

  .scroll-box { max-height: 50vh; }
  .empty-state { padding: 40px 12px; }
  .empty-state h2 { font-size: 18px; }
  .empty-state p { font-size: 13px; }

  /* 手机端聊天全屏 */
  .chat-panel { width: 100vw; }
  .chat-panel.open { transform: translateX(0); }
}

/* ========== 小屏手机 ========== */
@media (max-width: 400px) {
  .market-stats { grid-template-columns: 1fr 1fr; }
  .header h1 { font-size: 14px; }
  .btn-analyze { font-size: 12px; padding: 8px 12px; }
  .btn-analyze span:not(.spinner) { max-width: 80px; overflow: hidden; text-overflow: ellipsis; }
}
</style>
</head>
<body>

<div class="header">
  <h1>A股智能推荐系统</h1>
  <div class="header-right">
    <div class="status-bar" id="status-bar">
      <span class="status-dot dot-err" id="status-dot"></span>
      <span id="status-text">等待分析</span>
    </div>
    <button class="btn-chat" id="btn-chat" onclick="toggleChat()" title="AI行情助手">💬</button>
    <button class="btn-analyze" id="btn-analyze" onclick="doAnalyze()">
      <span class="spinner" id="spinner"></span>
      <span id="btn-text">一键获取市场分析</span>
    </button>
  </div>
</div>

<div class="container" id="main-container">
  <div class="empty-state" id="empty-state">
    <h2>点击上方按钮开始分析</h2>
    <p>系统将自动拉取：大盘指数、市场广度、北向资金、全板块排名、个股行情<br>
    然后生成：方向判断 + 追涨风险 + 板块排名 + 精选个股/ETF推荐<br><br>
    <small style="color:var(--dim)">点击 💬 可打开 AI 助手，实时讨论行情与操作</small></p>
  </div>
  <div class="loading-state" id="loading-state">
    <div class="spinner" style="display:inline-block;width:32px;height:32px;"></div>
    <div class="loading-text">正在拉取市场数据，请稍候...</div>
  </div>
  <div class="error-banner" id="error-banner"></div>
  <div id="results" style="display:none;">
    <div class="market-card" id="market-card"></div>
    <div class="quality-bar" id="quality-bar"></div>
    <div class="grid-2">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 2vw;">
        <div class="card-title">板块强度排名 TOP 30</div>
        <div class="scroll-box" id="sector-table"></div>
      </div>
      <div>
        <div class="card-title">买入推荐（个股优先 + ETF补充）</div>
        <div id="recs-container"></div>
      </div>
    </div>
    <div class="updated-at" id="updated-at"></div>
  </div>
</div>

<!-- ========== AI 聊天面板 ========== -->
<div class="chat-overlay" id="chat-overlay" onclick="toggleChat()"></div>
<div class="chat-panel" id="chat-panel">
  <div class="chat-panel-header">
    <h3><span class="ai-dot"></span> AI 行情助手</h3>
    <button class="btn-chat-close" onclick="toggleChat()">✕</button>
  </div>
  <div class="chat-messages" id="chat-messages">
    <div class="chat-empty" id="chat-empty">
      我是你的A股AI交易助手<br><br>
      可以先点「一键获取市场分析」获取最新数据<br>
      然后问我：<br><br>
      - 今天市场怎么样？<br>
      - 我买了XX，现在该怎么操作？<br>
      - 这个板块还能追吗？<br>
      - 帮我制定一个止损计划<br><br>
      <small>我会基于实时行情数据来回答</small>
    </div>
  </div>
  <div class="chat-input-wrap">
    <textarea class="chat-input" id="chat-input" rows="1" placeholder="输入你的问题..." onkeydown="handleChatKey(event)"></textarea>
    <button class="btn-send" id="btn-send" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// ===================================================================
// 主分析
// ===================================================================

async function doAnalyze() {
  const btn = $('btn-analyze'), spinner = $('spinner'), btnText = $('btn-text');
  btn.disabled = true; spinner.classList.add('active'); btnText.textContent = '数据获取中...';
  $('empty-state').style.display = 'none'; $('loading-state').classList.add('active');
  $('results').style.display = 'none'; $('error-banner').style.display = 'none';
  $('status-dot').className = 'status-dot dot-warn'; $('status-text').textContent = '分析中...';

  try {
    const r = await fetch('/api/ashare/analyze', { method: 'POST' });
    const data = await r.json();
    if (!data.ok) { showError(data.error || '分析失败'); updateStatus('err', '失败'); return; }
    render(data);
    $('loading-state').classList.remove('active'); $('results').style.display = 'block';
    updateStatus('ok', `更新于 ${data.last_updated || ''}`);
  } catch (e) {
    showError('网络请求失败: ' + e.message); updateStatus('err', '连接失败');
  } finally {
    btn.disabled = false; spinner.classList.remove('active'); btnText.textContent = '一键获取市场分析';
  }
}

function render(data) {
  renderMarketState(data.market_state);
  renderQuality(data.data_quality, data.elapsed);
  renderSectors(data.ranked_sectors || []);
  renderRecommendations(data.recommendations || []);
  $('updated-at').textContent = '数据更新时间: ' + (data.last_updated || '');
}

// ========== 市场状态 ==========

function renderMarketState(ms) {
  if (!ms) { $('market-card').innerHTML = '<span style="color:var(--dim)">无法获取市场状态</span>'; return; }

  const stateClass = {
    '进攻市': 'state-attack', '震荡偏多': 'state-attack',
    '震荡市': 'state-range', '防守市': 'state-defense',
    '修复反弹（弱）': 'state-defense', '修复反弹（待确认）': 'state-range'
  }[ms.composite] || 'state-other';

  const bulls = (ms.bull_signals || []).map(s => `<span class="signal-bull">${s}</span>`).join('<br>');
  const bears = (ms.bear_signals || []).map(s => `<span class="signal-bear">${s}</span>`).join('<br>');

  const chase = ms.chase_risk || {};
  const chaseCls = chase.level === '高' ? 'alert-danger' : (chase.level === '中' ? 'alert-warning' : 'alert-info');

  const recovery = ms.recovery || {};
  let recoveryHtml = '';
  if (recovery.detected) {
    recoveryHtml = `<div class="alert-warning alert-box" style="margin-top:8px;">⚠ ${recovery.label}</div>`;
  }

  let idxHtml = '';
  if (ms.indices_snapshot && ms.indices_snapshot.length) {
    idxHtml = ms.indices_snapshot.map(i =>
      `<span class="market-index">${i.name}: <strong>${i.price}</strong> <span style="color:${(i.change_pct||0)>=0?'var(--red)':'var(--green)'}">${(i.change_pct||0)>=0?'+':''}${i.change_pct}%</span> ${i.trend}</span>`
    ).join('  ');
  }

  const breadthRaw = ms.breadth_raw || {};
  const dirColor = ms.direction === '看多' || ms.direction === '偏多' ? 'var(--red)' : (ms.direction === '看空' || ms.direction === '偏空' ? 'var(--green)' : 'var(--yellow)');
  const dirConv = ms.conviction === '高' ? 'var(--red)' : 'var(--yellow)';
  const kl = ms.key_levels || {};

  $('market-card').innerHTML = `
    <div class="market-header">
      <span class="market-state-badge ${stateClass}">${ms.composite}</span>
      <span style="font-size:15px;">方向: <strong style="color:${dirColor}">${ms.direction}</strong></span>
      <span style="font-size:15px;">置信度: <strong style="color:${dirConv}">${ms.conviction}</strong></span>
      <span style="font-size:15px;">${ms.suitable ? '✅ 适合交易' : '⚠ 建议观望'}</span>
    </div>
    <div class="market-stats">
      <div class="market-stat">
        <div class="stat-val" style="color:${dirColor}">${ms.direction_score || 0}</div>
        <div class="stat-label">方向得分</div>
      </div>
      <div class="market-stat">
        <div class="stat-val">${ms.trend}</div>
        <div class="stat-label">指数趋势</div>
      </div>
      <div class="market-stat">
        <div class="stat-val">${ms.breadth}</div>
        <div class="stat-label">市场广度</div>
      </div>
      <div class="market-stat">
        <div class="stat-val" style="color:${(ms.north_5d||0)>=0?'var(--red)':'var(--green)'}">${(ms.north_5d||0)>=0?'+':''}${ms.north_5d}亿</div>
        <div class="stat-label">北向5日</div>
      </div>
      <div class="market-stat">
        <div class="stat-val" style="color:${chase.level==='高'?'var(--green)':'var(--red)'}">${chase.level}</div>
        <div class="stat-label">追涨风险</div>
      </div>
      ${kl.price ? `
      <div class="market-stat">
        <div class="stat-val">${kl.price} / ${kl.support}</div>
        <div class="stat-label">现价 / 支撑</div>
      </div>` : ''}
    </div>
    <div class="signal-list">${bulls} ${bears}</div>
    ${recoveryHtml}
    <div class="${chaseCls} alert-box" style="margin-top:8px;">
      ${chase.label || ''} ${(chase.reasons || []).join('；')}
    </div>
    <div class="market-indices">${idxHtml}</div>
    <div class="market-meta">
      ${breadthRaw['上涨'] != null ? `<span class="market-meta-item"><span class="label">涨跌比</span> <span class="value">${breadthRaw['上涨']}/${breadthRaw['下跌']}</span></span>` : ''}
      <span class="market-meta-item"><span class="label">涨停</span> <span class="value" style="color:var(--red)">${breadthRaw['涨停']||'?'}</span></span>
      <span class="market-meta-item"><span class="label">跌停</span> <span class="value" style="color:var(--green)">${breadthRaw['跌停']||'?'}</span></span>
      <span class="market-meta-item"><span class="label">北向20日</span> <span class="value" style="color:${(ms.north_20d||0)>=0?'var(--red)':'var(--green)'}">${(ms.north_20d||0)>=0?'+':''}${ms.north_20d}亿</span></span>
      ${kl.resistance ? `<span class="market-meta-item"><span class="label">阻力</span> <span class="value">${kl.resistance}</span></span>` : ''}
    </div>
    <div class="market-summary">${ms.summary}</div>
  `;
}

// ========== 数据质量 ==========

function renderQuality(dq, elapsed) {
  if (!dq) return;
  const items = [
    ['指数', dq.indices_ok], ['广度', dq.breadth_ok], ['北向', dq.north_ok],
    ['板块', dq.boards_ok], ['行业资金', dq.industry_flow_ok], ['ETF', dq.etfs_ok],
    ['涨停池', dq.limit_up_ok], ['个股', dq.stock_spot_ok],
  ];
  let html = items.map(([name, ok]) => {
    const ic = ok ? 'icon-ok' : 'icon-err';
    return `<span class="quality-item"><span class="${ic}">●</span> ${name}</span>`;
  }).join('');
  if (dq.errors && dq.errors.length) {
    html += `<span class="quality-item" style="color:var(--red);margin-left:12px;">⚠ ${dq.errors.join('; ')}</span>`;
  }
  html += `<span class="quality-item" style="margin-left:12px;">耗时 ${elapsed || '?'}s</span>`;
  $('quality-bar').innerHTML = html;
}

// ========== 板块排名 ==========

function renderSectors(sectors) {
  if (!sectors.length) {
    $('sector-table').innerHTML = '<div style="padding:20px;color:var(--dim);text-align:center;">暂无板块数据</div>';
    return;
  }
  let html = `<table class="sector-table"><tr><th>#</th><th>板块</th><th>涨跌幅</th><th>资金(亿)</th><th>评分</th><th>风险</th></tr>`;
  sectors.forEach(s => {
    const rankCls = s.rank <= 3 ? ' top3' : '';
    const focusCls = s.is_focus ? ' focus' : '';
    const focusTag = s.is_focus ? '<span class="focus-tag">关注</span>' : '';
    const pctCls = (s.change_pct || 0) >= 0 ? 'positive' : 'negative';
    const pctSign = (s.change_pct || 0) >= 0 ? '+' : '';
    let riskHtml = '';
    if (s.spike_warning) riskHtml = '<span class="spike-tag">⚠暴拉</span>';
    else if (s.chase_level === 'danger') riskHtml = '<span class="spike-tag">⚠追高</span>';
    html += `<tr>
      <td class="sector-rank${rankCls}">${s.rank}</td>
      <td class="sector-name${focusCls}">${s.name}${focusTag}</td>
      <td class="${pctCls}">${pctSign}${s.change_pct}%</td>
      <td>${(s.fund_flow || 0).toFixed(1)}</td>
      <td class="sector-score">${s.score.toFixed(2)}</td>
      <td>${riskHtml}</td>
    </tr>`;
  });
  html += '</table>';
  $('sector-table').innerHTML = html;
}

// ========== 推荐 ==========

function renderRecommendations(recs) {
  if (!recs.length) {
    $('recs-container').innerHTML = '<div class="no-recs"><p>当前暂无符合条件的买入推荐</p><p style="font-size:13px;">可能原因：市场追涨风险高、无板块处于健康回踩、或所有候选标的均不满足机构买入标准（低于2★）</p></div>';
    return;
  }
  let html = '';
  recs.forEach(r => {
    const stars = r.stars || 0;
    const starsLabel = r.stars_label || '★'.repeat(stars) + '☆'.repeat(5-stars);
    const allocPct = r.alloc_pct || r.position_plan?.total_allocation_pct || 10;

    // 星级颜色
    const starColor = stars >= 5 ? 'var(--red)' : (stars >= 4 ? '#ff8c00' : (stars >= 3 ? 'var(--yellow)' : 'var(--dim)'));
    const starBorder = stars >= 5 ? '5★-gold' : (stars >= 4 ? '4★' : '');

    const grade = r.entry_plan?.entry_grade || 'WAIT_PULLBACK';
    const cardCls = grade === 'BUY_NOW' ? 'buy-now' : (grade === 'WAIT_PULLBACK' ? 'wait' : 'avoid');
    const gradeCls = grade === 'BUY_NOW' ? 'grade-buy' : (grade === 'WAIT_PULLBACK' ? 'grade-wait' : 'grade-avoid');
    const gradeLabel = grade === 'BUY_NOW' ? '市价可入' : (grade === 'WAIT_PULLBACK' ? '等回调' : '不建议追高');
    const typeTag = r.type === 'STOCK' ? '<span class="rec-type-tag tag-stock">个股</span>' : '<span class="rec-type-tag tag-etf">ETF</span>';
    const tech = r.technical || {};
    const entry = r.entry_plan || {};
    const pos = r.position_plan || {};
    const pctCls = (r.change_pct || 0) >= 0 ? 'positive' : 'negative';
    const pctSign = (r.change_pct || 0) >= 0 ? '+' : '';

    const tranches = (entry.tranches || []).map((t, i) => {
      const hl = i === 0 ? ' tranche-highlight' : '';
      return `<div class="tranche-card${hl}">
        <div class="tranche-num">第${t.batch}批 (${t.ratio}%)</div>
        <div class="tranche-price">${t.price_type === '市价' ? '市价' : t.price}</div>
        <div class="tranche-detail">${t.note}</div>
        <div class="tranche-detail">${t.quantity}份 | ¥${t.amount.toLocaleString()}</div>
      </div>`;
    }).join('');

    let entryExtra = '';
    if (grade === 'WAIT_PULLBACK' && entry.target_price) {
      entryExtra = `<div class="entry-info-item"><span class="entry-info-label">建议挂单价:</span> <span class="entry-info-value" style="color:var(--yellow)">${entry.target_price}</span></div>`;
    }

    html += `<div class="rec-card ${cardCls}">
      <div class="rec-header">
        <div>
          <span class="rec-title">${r.name}${typeTag}</span>
          <span class="rec-code">${r.code}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:22px;color:${starColor};letter-spacing:2px;line-height:1;" title="${stars}星推荐">${starsLabel}</span>
          <span class="conf-badge" style="background:${starColor}22;color:${starColor};border:1px solid ${starColor}44">${allocPct}%仓位</span>
        </div>
      </div>
      <div class="rec-meta">
        <div class="rec-meta-item"><span class="rec-meta-label">当前价:</span><span class="rec-meta-value">${r.current_price}</span></div>
        <div class="rec-meta-item"><span class="rec-meta-label">板块:</span><span class="rec-meta-value">${r.sector} #${r.sector_rank}</span></div>
        ${r.change_pct != null ? `<div class="rec-meta-item"><span class="rec-meta-label">涨跌:</span><span class="rec-meta-value ${pctCls}">${pctSign}${r.change_pct}%</span></div>` : ''}
        ${r.turnover_rate != null ? `<div class="rec-meta-item"><span class="rec-meta-label">换手:</span><span class="rec-meta-value">${r.turnover_rate}%</span></div>` : ''}
        <div class="rec-meta-item"><span class="rec-meta-label">趋势:</span><span class="rec-meta-value">${tech.trend || '—'}</span></div>
        ${tech.dist_to_high_pct != null ? `<div class="rec-meta-item"><span class="rec-meta-label">距高点:</span><span class="rec-meta-value" style="color:var(--red)">${tech.dist_to_high_pct}%</span></div>` : ''}
      </div>
      ${tech.ma20 ? `<div style="font-size:12px;color:var(--dim);margin-bottom:8px;">
        MA5: ${tech.ma5||'—'} | MA20: ${tech.ma20} | MA60: ${tech.ma60||'—'} | 20日高: ${tech.high_20d||'—'}
      </div>` : ''}
      <div class="entry-info">
        <div class="entry-info-item"><span class="entry-info-label">入场:</span> <span class="grade-badge ${gradeCls}" style="display:inline-block;margin:0;">${gradeLabel}</span></div>
        <div class="entry-info-item"><span class="entry-info-label">止损:</span> <span class="stop-loss">${entry.stop_loss}</span> (-${entry.stop_loss_pct}%)</div>
        <div class="entry-info-item"><span class="entry-info-label">最大亏损:</span> <span class="stop-loss">¥${(entry.max_loss_amount||0).toLocaleString()}</span></div>
        <div class="entry-info-item"><span class="entry-info-label">仓位:</span> <span class="entry-info-value">${allocPct}% (¥${(pos.total_amount||0).toLocaleString()})</span></div>
        ${entryExtra}
      </div>
      ${entry.tranches && entry.tranches.length > 0 ? `<div class="tranches">${tranches}</div>` : ''}
      <div class="rec-footer">
        <div class="rec-reasoning">${r.reasoning}</div>
      </div>
    </div>`;
  });
  $('recs-container').innerHTML = html;
}

function showError(msg) {
  $('error-banner').textContent = '错误: ' + msg; $('error-banner').style.display = 'block';
  $('loading-state').classList.remove('active');
}
function updateStatus(type, text) {
  $('status-dot').className = 'status-dot ' + (type === 'ok' ? 'dot-ok' : type === 'warn' ? 'dot-warn' : 'dot-err');
  $('status-text').textContent = text;
}

// ===================================================================
// AI 聊天 (SSE 流式)
// ===================================================================

let _chatOpen = false;
let _chatHistory = [];
const MAX_HISTORY = 20;

function toggleChat() {
  _chatOpen = !_chatOpen;
  $('chat-panel').classList.toggle('open', _chatOpen);
  $('chat-overlay').classList.toggle('open', _chatOpen);
  $('btn-chat').classList.toggle('active', _chatOpen);
  if (window.innerWidth > 768) {
    $('main-container').classList.toggle('chat-open', _chatOpen);
  }
  if (_chatOpen) {
    setTimeout(() => $('chat-input').focus(), 350);
  }
}

function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const input = $('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  input.style.height = 'auto';
  $('btn-send').disabled = true;

  const empty = $('chat-empty');
  if (empty) empty.style.display = 'none';

  // 添加用户消息
  addChatBubble('user', msg);

  // 创建流式 AI 气泡
  const streamId = 'stream-' + Date.now();
  const time = new Date().toLocaleTimeString('zh', { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = 'chat-msg ai';
  div.id = streamId;
  div.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  $('chat-messages').appendChild(div);
  $('chat-messages').scrollTop = $('chat-messages').scrollHeight;

  let fullText = '';
  let firstDelta = true;

  try {
    const resp = await fetch('/api/ashare/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, history: _chatHistory }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.type === 'delta') {
            if (firstDelta) {
              div.innerHTML = '';
              firstDelta = false;
            }
            fullText += data.text;
            div.innerHTML = fullText.replace(/\n/g, '<br>');
          } else if (data.type === 'status') {
            if (firstDelta) {
              div.innerHTML = '';
              firstDelta = false;
            }
            fullText += data.text;
            div.innerHTML = fullText.replace(/\n/g, '<br>');
          } else if (data.type === 'done') {
            // OK
          } else if (data.type === 'error') {
            if (firstDelta) div.innerHTML = '';
            div.innerHTML = '抱歉，' + (data.text || '未知错误');
            fullText = '';
          }
        } catch (_) {}
      }
      $('chat-messages').scrollTop = $('chat-messages').scrollHeight;
    }
  } catch (e) {
    div.innerHTML = '网络错误：' + e.message;
    fullText = '';
  }

  // 添加时间戳
  if (fullText) {
    div.innerHTML = renderMarkdown(fullText) + `<span class="msg-time">${time}</span>`;
    _chatHistory.push({ role: 'assistant', content: fullText });
    if (_chatHistory.length > MAX_HISTORY) _chatHistory = _chatHistory.slice(-MAX_HISTORY);
  } else if (div.innerHTML.trim() === '') {
    div.innerHTML = '（无响应）<span class="msg-time">' + time + '</span>';
  }

  $('btn-send').disabled = false;
  input.focus();
}

function renderMarkdown(text) {
  var html = text;

  // 代码块 ```...```
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');

  // 行内代码 `...`
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // 粗体 **...**
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  // 引用 > ...
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // 无序列表 - item / * item
  html = html.replace(/(?:^|\n)[-*] (.+?)(?=\n|$)/g, function(m) {
    return '\n<li>' + m.replace(/^[-*] /, '') + '</li>';
  });

  // 有序列表 1. item
  html = html.replace(/(?:^|\n)(\d+)\. (.+?)(?=\n|$)/g, function(m) {
    return '\n<li>' + m.replace(/^\d+\. /, '') + '</li>';
  });

  // 包装连续 <li> 为 <ul>
  html = html.replace(/((?:<li>.*?<\/li>\n?)+)/g, '<ul>$1</ul>');
  html = html.replace(/<ul>\s*<\/ul>/g, '');
  html = html.replace(/<ul>\n/g, '<ul>');

  // 链接 [text](url)
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none;">$1</a>');

  // 表格 | col | col |
  html = html.replace(/\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/g, function(m, header, rows) {
    var hcols = header.split('|').map(function(c) { return c.trim(); }).filter(function(c) { return c; });
    var th = '<tr>' + hcols.map(function(c) { return '<th>' + c + '</th>'; }).join('') + '</tr>';
    var trs = rows.trim().split('\n').map(function(row) {
      var cols = row.split('|').map(function(c) { return c.trim(); }).filter(function(c) { return c; });
      return '<tr>' + cols.map(function(c) {
        var cls = parseFloat(c) < 0 ? 'neg' : '';
        return '<td class="' + cls + '">' + c + '</td>';
      }).join('') + '</tr>';
    }).join('');
    return '<table>' + th + trs + '</table>';
  });

  return html;
}

function addChatBubble(role, content) {
  const isUser = role === 'user';
  const time = new Date().toLocaleTimeString('zh', { hour: '2-digit', minute: '2-digit' });

  _chatHistory.push({ role: role === 'user' ? 'user' : 'assistant', content });
  if (_chatHistory.length > MAX_HISTORY) _chatHistory = _chatHistory.slice(-MAX_HISTORY);

  const div = document.createElement('div');
  div.className = `chat-msg ${isUser ? 'user' : 'ai'}`;
  const body = isUser ? content.replace(/\n/g, '<br>') : renderMarkdown(content);
  div.innerHTML = `${body}<span class="msg-time">${time}</span>`;
  $('chat-messages').appendChild(div);
  $('chat-messages').scrollTop = $('chat-messages').scrollHeight;
}

$('chat-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 80) + 'px';
});
</script>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaMind AI 智能交易系统</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --dim: #8b949e;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d2991d;
  --blue: #58a6ff;
  --accent: #1f6feb;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header h1 { font-size: 20px; font-weight: 600; }
.header .status { font-size: 13px; color: var(--dim); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
  padding: 24px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
}
.card h2 {
  font-size: 14px;
  color: var(--dim);
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}
.price-big {
  font-size: 36px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.price-detail { display: flex; gap: 20px; margin-top: 10px; font-size: 14px; }
.price-detail span { color: var(--dim); }
.price-detail strong { color: var(--text); }
.trend-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
}
.trend-up { background: rgba(63,185,80,0.15); color: var(--green); }
.trend-down { background: rgba(248,81,73,0.15); color: var(--red); }
.trend-side { background: rgba(210,153,29,0.15); color: var(--yellow); }
.signal-box {
  padding: 16px;
  border-radius: 6px;
  text-align: center;
  margin: 8px 0;
}
.signal-buy { background: rgba(63,185,80,0.1); border: 1px solid rgba(63,185,80,0.3); }
.signal-sell { background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); }
.signal-hold { background: rgba(210,153,29,0.1); border: 1px solid rgba(210,153,29,0.3); }
.signal-action {
  font-size: 24px;
  font-weight: 700;
  display: block;
}
.confidence-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--border);
  margin-top: 8px;
  overflow: hidden;
}
.confidence-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}
.conf-high { background: var(--green); }
.conf-mid { background: var(--yellow); }
.conf-low { background: var(--red); }
.btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s;
}
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #1a5dcc; }
.btn-danger { border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: rgba(248,81,73,0.1); }
.summary-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-label { font-size: 12px; color: var(--dim); }
.stat-value { font-size: 18px; font-weight: 600; }
.pnl-pos { color: var(--green); }
.pnl-neg { color: var(--red); }
.trade-log { max-height: 300px; overflow-y: auto; font-size: 13px; }
.trade-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.trade-row:last-child { border-bottom: none; }
.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.switch {
  position: relative;
  width: 40px;
  height: 22px;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--border);
  border-radius: 22px;
  transition: 0.2s;
}
.slider:before {
  content: "";
  position: absolute;
  height: 16px;
  width: 16px;
  left: 3px;
  bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: 0.2s;
}
input:checked + .slider { background: var(--accent); }
input:checked + .slider:before { transform: translateX(18px); }
.error-box {
  background: rgba(248,81,73,0.1);
  border: 1px solid var(--red);
  padding: 10px;
  border-radius: 6px;
  color: var(--red);
  font-size: 13px;
  margin-top: 10px;
  display: none;
}
.info-tag {
  font-size: 12px;
  color: var(--dim);
  margin-top: 4px;
}
</style>
</head>
<body>

<div class="header">
  <h1>AlphaMind AI 智能交易系统</h1>
  <div style="display:flex;align-items:center;gap:14px;">
    <div class="status" id="status">加载中...</div>
    <button onclick="logoutUser()" style="padding:7px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text);cursor:pointer;">退出</button>
  </div>
</div>

<div class="grid">
  <!-- 行情数据 -->
  <div class="card">
    <h2>行情数据 — XAUUSD (上海金交所 Au99.99)</h2>
    <div class="price-big" id="price">--</div>
    <div class="info-tag">人民币 / 克</div>
    <div class="price-detail">
      <div>开: <strong id="open">--</strong></div>
      <div>高: <strong id="high">--</strong></div>
      <div>低: <strong id="low">--</strong></div>
    </div>
    <div style="margin-top:8px;">
      趋势: <span class="trend-badge" id="trend-badge">--</span>
      <span style="font-size:13px;color:var(--dim);margin-left:8px;" id="trend-strength"></span>
    </div>
    <div class="info-tag" id="source-info"></div>
    <div class="error-box" id="error-box"></div>
  </div>

  <!-- 交易信号 -->
  <div class="card">
    <h2>交易信号</h2>
    <div class="signal-box signal-hold" id="signal-box">
      <span class="signal-action" id="sig-action">--</span>
    </div>
    <div style="font-size:13px;color:var(--dim);" id="sig-reason"></div>
    <div style="margin-top:8px;font-size:13px;">
      置信度: <strong id="sig-conf">--</strong>
    </div>
    <div class="confidence-bar">
      <div class="confidence-fill" id="conf-bar" style="width:0%"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="doRefresh()">获取数据并分析</button>
      <button class="btn btn-primary" onclick="doExecute()" id="btn-exec" disabled>执行交易</button>
    </div>
    <div class="btn-row">
      <label class="toggle">
        <span class="switch">
          <input type="checkbox" id="auto-toggle" onchange="doAutoToggle()">
          <span class="slider"></span>
        </span>
        自动交易 (30秒间隔)
      </label>
    </div>
  </div>

  <!-- 账户概况 -->
  <div class="card">
    <h2>账户概况</h2>
    <div class="summary-stats">
      <div>
        <div class="stat-label">余额</div>
        <div class="stat-value" id="balance">--</div>
      </div>
      <div>
        <div class="stat-label">净值</div>
        <div class="stat-value" id="equity">--</div>
      </div>
      <div>
        <div class="stat-label">持仓价值</div>
        <div class="stat-value" id="pos-val">--</div>
      </div>
      <div>
        <div class="stat-label">总交易数</div>
        <div class="stat-value" id="total-trades">--</div>
      </div>
    </div>
    <div style="margin-top:12px;font-size:13px;" id="position-detail"></div>
    <div class="btn-row">
      <button class="btn btn-danger" onclick="doReset()">重置账户</button>
    </div>
  </div>

  <!-- 交易记录 -->
  <div class="card">
    <h2>交易记录</h2>
    <div class="trade-log" id="trade-log">
      <div style="color:var(--dim);font-size:13px;">暂无交易</div>
    </div>
  </div>
</div>

<script>
async function logoutUser() {
  await fetch('/api/auth/logout', { method: 'POST' });
  location.href = '/login';
}

const $ = id => document.getElementById(id);

// 趋势中文映射
const TREND_CN = { UP: '上涨', DOWN: '下跌', SIDEWAYS: '震荡' };
// 信号中文映射
const ACTION_CN = { BUY: '买入', SELL: '卖出', HOLD: '观望' };
// 状态中文映射
const STATUS_CN = { FILLED: '已成交', PENDING: '待执行', CANCELLED: '已取消', MANUAL: '手动' };

async function loadState() {
  try {
    const r = await fetch('api/state');
    const s = await r.json();
    render(s);
    $('status').textContent = '最近更新: ' + (s.last_updated || '从未');
  } catch (e) {
    $('status').textContent = '连接错误';
  }
}

function render(s) {
  // 行情数据
  if (s.market_data) {
    const d = s.market_data;
    $('price').textContent = d.price.toLocaleString();
    $('open').textContent = d.open?.toLocaleString() || '--';
    $('high').textContent = d.high?.toLocaleString() || '--';
    $('low').textContent = d.low?.toLocaleString() || '--';

    const badge = $('trend-badge');
    const trendLabel = TREND_CN[d.trend] || d.trend;
    badge.textContent = trendLabel;
    badge.className = 'trend-badge';
    if (d.trend === 'UP') badge.classList.add('trend-up');
    else if (d.trend === 'DOWN') badge.classList.add('trend-down');
    else badge.classList.add('trend-side');

    $('trend-strength').textContent = d.trend_strength ? `(强度: ${d.trend_strength})` : '';
    $('source-info').textContent = `数据源: ${d.source} | ${d.timestamp}`;
  }

  // 错误信息
  $('error-box').style.display = s.error ? 'block' : 'none';
  if (s.error) $('error-box').textContent = '错误: ' + s.error;

  // 交易信号
  if (s.trade_signal) {
    const sig = s.trade_signal;
    $('sig-action').textContent = ACTION_CN[sig.action] || sig.action;
    $('sig-reason').textContent = sig.reason || '';
    $('sig-conf').textContent = (sig.confidence * 100).toFixed(1) + '%';

    const box = $('signal-box');
    box.className = 'signal-box';
    if (sig.action === 'BUY') box.classList.add('signal-buy');
    else if (sig.action === 'SELL') box.classList.add('signal-sell');
    else box.classList.add('signal-hold');

    const bar = $('conf-bar');
    bar.style.width = (sig.confidence * 100) + '%';
    bar.className = 'confidence-fill';
    if (sig.confidence >= 0.7) bar.classList.add('conf-high');
    else if (sig.confidence >= 0.55) bar.classList.add('conf-mid');
    else bar.classList.add('conf-low');

    $('btn-exec').disabled = sig.action === 'HOLD';
  }

  // 最近交易结果
  if (s.last_result) {
    const r = s.last_result;
    if (r.status === 'FILLED') {
      let extra = '';
      if (r.pnl != null) extra = ` | 盈亏: ${r.pnl >= 0 ? '+' : ''}${r.pnl} (${r.pnl_pct}%)`;
      $('status').textContent += ` | 最近: ${STATUS_CN[r.status] || r.status} ${ACTION_CN[r.action] || r.action} @ ${r.price}${extra}`;
    }
  }

  // 账户概况
  if (s.summary) {
    const a = s.summary;
    $('balance').textContent = a.balance.toLocaleString();
    $('equity').textContent = a.equity.toLocaleString();
    $('pos-val').textContent = a.position_value.toLocaleString();
    $('total-trades').textContent = a.total_trades;

    if (a.position) {
      $('position-detail').innerHTML = `
        <span style="color:var(--green);">持仓:</span>
        ${a.position.symbol} x${a.position.quantity} @ ${a.position.avg_price}
        (成本: ${a.position.cost_basis.toFixed(2)})
      `;
    } else {
      $('position-detail').textContent = '无持仓';
    }
  }

  // 交易记录
  if (s.trade_log && s.trade_log.length > 0) {
    $('trade-log').innerHTML = s.trade_log.slice().reverse().map(t => `
      <div class="trade-row">
        <span>
          <span style="color:${t.action === 'BUY' ? 'var(--green)' : 'var(--red)'};font-weight:600;">
            ${ACTION_CN[t.action] || t.action}
          </span>
          ${t.quantity || ''} @ ${t.price}
        </span>
        <span>
          ${t.pnl != null ? `<span class="${t.pnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">${t.pnl >= 0 ? '+' : ''}${t.pnl} (${t.pnl_pct}%)</span>` : `余额: ${t.balance}`}
        </span>
      </div>
    `).join('');
  } else {
    $('trade-log').innerHTML = '<div style="color:var(--dim);font-size:13px;">暂无交易</div>';
  }

  // 自动交易开关
  $('auto-toggle').checked = s.auto_trade;
}

async function doRefresh() {
  $('status').textContent = '获取数据中...';
  try {
    await fetch('api/refresh', { method: 'POST' });
  } catch (e) {}
  await loadState();
}

async function doExecute() {
  $('status').textContent = '执行交易中...';
  try {
    const r = await fetch('api/execute', { method: 'POST' });
    const j = await r.json();
    if (!j.ok) $('status').textContent = '错误: ' + j.error;
  } catch (e) {}
  await loadState();
}

async function doAutoToggle() {
  const enabled = $('auto-toggle').checked;
  await fetch('api/auto', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled }) });
  loadState();
}

async function doReset() {
  if (confirm('确定要重置账户吗？这将清除所有持仓和交易记录。')) {
    await fetch('api/reset', { method: 'POST' });
    loadState();
  }
}

// 初始化
loadState();
// 每10秒自动刷新
setInterval(loadState, 10000);
</script>
</body>
</html>
